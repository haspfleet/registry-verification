<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Vehicle Registry</title>

<style>
body{
font-family:Arial,sans-serif;
text-align:center;
margin-top:100px;
}

input{
padding:10px;
font-size:20px;
}

button{
padding:10px 20px;
font-size:20px;
}

#result{
margin-top:40px;
font-size:30px;
line-height:2;
}
</style>
</head>

<body>

<div id="login">
<input type="password" id="pwd" placeholder="Password">
<button id="btn">Enter</button>
</div>

<div id="result"></div>

<script>

const PASSWORD="R@dar242026b";

document.getElementById("btn").addEventListener("click",checkPassword);

function clean(t){
return t.replace(/\uFEFF/g,"").trim();
}

function checkPassword(){

const p=document.getElementById("pwd").value;

if(p!==PASSWORD){
alert("Wrong password");
return;
}

const params=new URLSearchParams(window.location.search);
const id=clean(params.get("id")||"");

fetch("FleetRegistry20261009.csv")
.then(r=>r.text())
.then(data=>{

const rows=data.split(/\r?\n/);

for(let i=1;i<rows.length;i++){

const cols=rows[i].split(";");

if(cols.length<5) continue;

const currentId=clean(cols[0]);

if(currentId===id){

document.getElementById("login").style.display="none";

document.getElementById("result").innerHTML=
clean(cols[1])+
"<br><br>"+
clean(cols[4])+
"<br><br>"+
clean(cols[3]);

return;
}
}

document.getElementById("result").innerHTML="Record not found";

})
.catch(err=>{

document.getElementById("result").innerHTML=
"CSV ERROR";

console.log(err);

});

}

</script>

</body>
</html>
