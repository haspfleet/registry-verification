
<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicle Registry</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    box-sizing: border-box;
    background-image: url("./BG-P.png");
    background-repeat: no-repeat;
    background-position: center center;
    background-size: 100% 100%;
}

input {
    padding: 10px 12px;
    font-size: 18px;
    width: 280px;
    max-width: 80%;
    box-sizing: border-box;
    font-weight: bold;
    color: #003b75;
}

button {
    padding: 10px 20px;
    font-size: 20px;
    cursor: pointer;
    font-weight: bold;
    color: #003b75;
}

#login {
    position: absolute;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 240px;
    max-width: 90%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
}

#result {
    position: absolute;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 94%;
    margin: 0;
    font-size: 30px;
    font-weight: bold;
    color: #003b75;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

@media (orientation: landscape) {
    body {
        background-image: url("./BG-L.png");
    }

    #login,
    #result {
        top: 50%;
        width: 90%;
    }
}
</style>
</head>
<body>

<div id="login">
    <input type="password" id="pwd" placeholder="Password">
    <button id="btn" type="button">Enter</button>
</div>

<div id="result"></div>

<script>
const API_URL = "https://haspfleet-registry-api.ek-hcaa.workers.dev/verify";

document.getElementById("btn").addEventListener("click", checkPassword);

document.getElementById("pwd").addEventListener("keydown", function(event) {
    if (event.key === "Enter") checkPassword();
});

function clean(value) {
    return (value || "").replace(/\uFEFF/g, "").trim();
}

async function checkPassword() {
    const password = document.getElementById("pwd").value;
    const result = document.getElementById("result");
    const login = document.getElementById("login");

    const params = new URLSearchParams(window.location.search);
    const id = clean(params.get("id"));

    if (!id) {
        result.textContent = "Missing ID";
        return;
    }

    result.textContent = "Searching...";
    document.getElementById("btn").disabled = true;

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password, id })
        });

        const data = await response.json();

        if (response.status === 401) {
            alert("Wrong password");
            result.textContent = "";
            return;
        }

        if (!response.ok || !data.success) {
            result.textContent = data.error || "Search failed";
            return;
        }

        result.replaceChildren();

        result.appendChild(document.createTextNode(clean(data.icao)));
        result.appendChild(document.createElement("br"));
        result.appendChild(document.createElement("br"));
        result.appendChild(document.createTextNode(clean(data.call_sign)));
        result.appendChild(document.createElement("br"));
        result.appendChild(document.createElement("br"));
        result.appendChild(document.createTextNode(clean(data.plate)));

        login.style.display = "none";

    } catch (error) {
        console.error("Registry error:", error);
        result.textContent = "Connection error";
    } finally {
        document.getElementById("btn").disabled = false;
    }
}
</script>
</body>
</html>
