
<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicle Registry</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    box-sizing: border-box;
    background-image: url("./BG-P.png");
    background-repeat: no-repeat;
    background-position: center center;
    background-size: 100% 100%;
}

input {
    padding: 10px 12px;
    font-size: 18px;
    width: 280px;
    max-width: 80%;
    box-sizing: border-box;
    font-weight: bold;
    color: #003b75;
}

button {
    padding: 10px 20px;
    font-size: 20px;
    cursor: pointer;
    font-weight: bold;
    color: #003b75;
}

#login {
    position: absolute;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 250px;
    max-width: 90%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 12px;
}

#result {
    position: absolute;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 78%;
    max-width: 420px;
    margin: 0;
    font-size: 26px;
    font-weight: bold;
    color: #003b75;
    line-height: 1.3;
    overflow-wrap: anywhere;
}

@media (orientation: landscape) {
    body {
        background-image: url("./BG-L.png");
    }

    #login,
    #result {
        top: 50%;
        width: 90%;
    }
}
.password-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    width: 280px;
    max-width: 80%;
    min-width: 0;
    flex-shrink: 1;
}

.password-wrapper input {
    padding-right: 44px;
}

#togglePassword {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    padding: 4px;
    border: none;
    background: transparent;
    color: #003b75;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

#eyeIcon {
    width: 24px;
    height: 24px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}
</style></head>
<body>

<div id="login">
    <div class="password-wrapper">
        <input type="password" id="pwd" placeholder="Password">
        <button id="togglePassword" type="button" aria-label="Show password">
            <svg id="eyeIcon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
        </button>
    </div>
    <button id="btn" type="button">Enter</button>
</div>

<div id="result"></div>

<script>
const API_URL = "https://haspfleet-registry-api.ek-hcaa.workers.dev/verify";

document.getElementById("btn").addEventListener("click", checkPassword);
document.getElementById("togglePassword").addEventListener("click", function() {
    const passwordInput = document.getElementById("pwd");
    const eyeIcon = document.getElementById("eyeIcon");
    const showingPassword = passwordInput.type === "password";

    passwordInput.type = showingPassword ? "text" : "password";

    eyeIcon.innerHTML = showingPassword
        ? '<path d="M3 3l18 18"></path><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.5 15.5 0 0 1-3.1 3.9"></path><path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.6 10.6 0 0 0 4-.8"></path>'
        : '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle>';

    this.setAttribute("aria-label", showingPassword ? "Hide password" : "Show password");
});
document.getElementById("pwd").addEventListener("keydown", function(event) {
    if (event.key === "Enter") checkPassword();
});

function clean(value) {
    return (value || "").replace(/\uFEFF/g, "").trim();
}

async function checkPassword() {
    const password = document.getElementById("pwd").value;
    const result = document.getElementById("result");
    const login = document.getElementById("login");

    const params = new URLSearchParams(window.location.search);
    const id = clean(params.get("id"));

    if (!id) {
        result.textContent = "Missing ID";
        return;
    }

    result.textContent = "Searching...";
    document.getElementById("btn").disabled = true;

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password, id })
        });

        const data = await response.json();

        if (response.status === 401) {
            alert("Wrong password");
            result.textContent = "";
            return;
        }

        if (!response.ok || !data.success) {
            result.textContent = data.error || "Search failed";
            return;
        }

        result.replaceChildren();

result.appendChild(document.createTextNode(clean(data.icao)));
result.appendChild(document.createElement("br"));

result.appendChild(document.createTextNode(clean(data.call_sign)));
result.appendChild(document.createElement("br"));

result.appendChild(document.createTextNode(clean(data.plate)));

login.style.display = "none";

    } catch (error) {
        console.error("Registry error:", error);
        result.textContent = "Connection error";
    } finally {
        document.getElementById("btn").disabled = false;
    }
}
</script>
</body>
</html>
