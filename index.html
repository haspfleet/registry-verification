
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicle Registry</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin-top: 100px;
}

input {
    padding: 10px;
    font-size: 20px;
    max-width: 80%;
}

button {
    padding: 10px 20px;
    font-size: 20px;
    cursor: pointer;
}

#result {
    margin-top: 40px;
    font-size: 30px;
    line-height: 2;
    overflow-wrap: anywhere;
}
</style>
</head>

<body>

<div id="login">
    <input type="password" id="pwd" placeholder="Password">
    <button id="btn" type="button">Enter</button>
</div>

<div id="result"></div>

<script>
const PASSWORD = "R@dar242026b";

document.getElementById("btn").addEventListener("click", checkPassword);

document.getElementById("pwd").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        checkPassword();
    }
});

function clean(value) {
    return (value || "").replace(/\uFEFF/g, "").trim();
}

async function checkPassword() {
    const password = document.getElementById("pwd").value;
    const result = document.getElementById("result");
    const login = document.getElementById("login");

    if (password !== PASSWORD) {
        alert("Wrong password");
        return;
    }

    const params = new URLSearchParams(window.location.search);
    const id = clean(params.get("id"));

    if (!id) {
        result.textContent = "Missing ID";
        return;
    }

    result.textContent = "Searching...";

    try {
        const response = await fetch(
            "FleetRegistry20261009.csv?v=100"
        );

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.text();
        const rows = data.split(/\r?\n/);

        for (let i = 1; i < rows.length; i++) {
            const cols = rows[i].split(";");

            // CSV columns: ID;ICAO;Vehicle Plate;CALL SIGN
            if (cols.length < 4) {
                continue;
            }

            const currentId = clean(cols[0]);

            if (currentId === id) {
                result.replaceChildren();

                // ICAO
                result.appendChild(
                    document.createTextNode(clean(cols[1]))
                );

                result.appendChild(document.createElement("br"));
                result.appendChild(document.createElement("br"));

                // CALL SIGN
                result.appendChild(
                    document.createTextNode(clean(cols[3]))
                );

                result.appendChild(document.createElement("br"));
                result.appendChild(document.createElement("br"));

                // Vehicle Plate
                result.appendChild(
                    document.createTextNode(clean(cols[2]))
                );

                login.style.display = "none";
                return;
            }
        }

        result.textContent = "Record not found";

    } catch (error) {
        console.error("Registry error:", error);
        result.textContent = "CSV ERROR";
    }
}
</script>

</body>
</html>
